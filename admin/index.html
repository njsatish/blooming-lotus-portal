<!-- BLOOMING_STATUS_PILLS_V13_STYLE -->
<style>
  /* Appointment status labels must size to their text, not to the card. */
  .card .badge,
  .card .status,
  .appointment .badge,
  .appointment .status,
  .appointment-state .badge,
  .appointment-state .status,
  [data-status-pill-v13] {
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    flex: 0 0 auto !important;
    width: auto !important;
    height: auto !important;
    min-width: 0 !important;
    min-height: 0 !important;
    max-width: 100% !important;
    aspect-ratio: auto !important;
    padding: 6px 11px !important;
    margin: 0 !important;
    border-radius: 999px !important;
    white-space: nowrap !important;
    line-height: 1.15 !important;
    font-size: 12px !important;
    font-weight: 800 !important;
    letter-spacing: 0.2px !important;
    text-align: center !important;
    overflow: visible !important;

  .card > .badge,
  .card > .status,

    justify-self: end !important;
  }

    background: #fff4cf !important;

  }

  }

  }

  }

<script id="bl-admin-prefill-v18">
(function () {
  'use strict';

  let lastPreferredDate = '';
  let lastPreferredTime = '';

  function pageTextWithoutModal() {
    const clone = document.body.cloneNode(true);
    clone.querySelectorAll('input,textarea,select,button,script,style').forEach(function (node) {
      node.remove();
    });
    return (clone.innerText || clone.textContent || '').replace(/\u00a0/g, ' ');
  }

  function capturePreferredValues() {
    const text = pageTextWithoutModal();
    const dateMatch = text.match(/Preferred\s*date\s*:\s*(\d{4}-\d{2}-\d{2})/i);
    const timeMatch = text.match(/Preferred\s*time\s*:\s*(\d{1,2}:\d{2})/i);
    if (dateMatch) lastPreferredDate = dateMatch[1];
    if (timeMatch) lastPreferredTime = timeMatch[1].padStart(5, '0');
  }

  function isVisible(element) {
    if (!element) return false;
    const style = window.getComputedStyle(element);
    const rect = element.getBoundingClientRect();
    return style.display !== 'none' && style.visibility !== 'hidden' && rect.width > 0 && rect.height > 0;
  }

  function nativeSet(input, value) {
    if (!input || !value || input.value === value) return;
    const descriptor = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');
    descriptor.set.call(input, value);
    input.dispatchEvent(new Event('input', { bubbles: true }));
    input.dispatchEvent(new Event('change', { bubbles: true }));
    input.dispatchEvent(new Event('blur', { bubbles: true }));
  }

  function fillVisibleConfirmationFields() {
    capturePreferredValues();
    if (!lastPreferredDate || !lastPreferredTime) return false;

    const dateInputs = Array.from(document.querySelectorAll('input[type="date"]')).filter(isVisible);
    const timeInputs = Array.from(document.querySelectorAll('input[type="time"]')).filter(isVisible);
    if (!dateInputs.length || !timeInputs.length) return false;

    const dateInput = dateInputs.find(function (input) { return !input.value; }) || dateInputs[0];
    const timeInput = timeInputs.find(function (input) { return !input.value; }) || timeInputs[0];

    const container = dateInput.closest('[role="dialog"],dialog,.modal,[class*="modal"],[class*="dialog"]') || dateInput.parentElement;
    const context = ((container && container.textContent) || document.body.textContent || '').toUpperCase();
    if (!context.includes('CONFIRMED')) return false;

    nativeSet(dateInput, lastPreferredDate);
    nativeSet(timeInput, lastPreferredTime);
    return Boolean(dateInput.value && timeInput.value);
  }

  function runPrefillSequence() {
    capturePreferredValues();
    [0, 50, 150, 300, 600, 1000].forEach(function (delay) {
      window.setTimeout(fillVisibleConfirmationFields, delay);
    });
  }

  document.addEventListener('mousedown', capturePreferredValues, true);
  document.addEventListener('click', runPrefillSequence, true);
  document.addEventListener('keydown', function (event) {
    if (event.key === 'Enter' || event.key === ' ') runPrefillSequence();
  }, true);

  const observer = new MutationObserver(function () {
    fillVisibleConfirmationFields();
  });
  observer.observe(document.documentElement, { childList: true, subtree: true });
})();
</script>

  }

  .ann-validation-v24 {
    margin: 10px 0;
    padding: 10px 12px;
    border: 1px solid #e1a5a5;
    border-radius: 9px;
    background: #fff0f0;
    color: #922f2f;
    font-weight: 700;
  }

  .ann-warning-v24 {
    margin: 10px 0;
    padding: 10px 12px;
    border: 1px solid #e8cd83;
    border-radius: 9px;
    background: #fff7dc;
    color: #805700;
    font-weight: 700;
  }
</style>

<script id="bl-announcements-v24">
(function () {
  "use strict";

  const API =
    "https://w61mphhi00.execute-api.us-east-1.amazonaws.com";

  function getToken() {
    return sessionStorage.getItem("bl_access") || "";
  }

  function findLabelInput(pattern) {
    const labels = Array.from(
      document.querySelectorAll(".ann-box-v29 label")
    );

    const label = labels.find(function (item) {
      return pattern.test(item.textContent || "");
    });

    if (!label) {
      return null;
    }

    return label.querySelector("input, select, textarea");
  }

  function clearValidationMessages(box) {
    box
      .querySelectorAll(".ann-validation-v24")
      .forEach(function (element) {
        element.remove();
      });
  }

  function addValidationMessage(box, messages) {
    const message = document.createElement("div");

    message.className = "ann-validation-v24";
    message.setAttribute("role", "alert");
    message.textContent = messages.join(" ");

    const actions = box.querySelector(".ann-actions-v29");

    if (actions) {
      actions.before(message);
    } else {
      box.appendChild(message);
    }
  }

  function validateAnnouncementForm() {
    const box = document.querySelector(".ann-box-v29");

    if (!box) {
      return true;
    }

    clearValidationMessages(box);

    const displayFrom = findLabelInput(/display from/i);
    const displayUntil = findLabelInput(/display until/i);
    const closureBegins = findLabelInput(/closure begins/i);
    const closureEnds = findLabelInput(/closure ends/i);
    const type = findLabelInput(/^type/i);
    const blockDates = findLabelInput(/block appointment dates/i);

    const errors = [];

    if (
      displayFrom &&
      displayUntil &&
      displayFrom.value &&
      displayUntil.value
    ) {
      const from = new Date(displayFrom.value);
      const until = new Date(displayUntil.value);

      if (
        Number.isNaN(from.getTime()) ||
        Number.isNaN(until.getTime())
      ) {
        errors.push(
          "Display from and Display until must be valid dates and times."
        );
      } else if (until <= from) {
        errors.push(
          "Display until must be later than Display from."
        );
      }
    }

    const requiresClosureDates =
      (type && type.value === "CLOSURE") ||
      (blockDates && blockDates.checked) ||
      (closureBegins && closureBegins.value) ||
      (closureEnds && closureEnds.value);

    if (requiresClosureDates) {
      if (
        !closureBegins ||
        !closureBegins.value ||
        !closureEnds ||
        !closureEnds.value
      ) {
        errors.push(
          "Closure start and closure end dates are required."
        );
      } else if (closureEnds.value < closureBegins.value) {
        errors.push(
          "Closure end date cannot be before closure start date."
        );
      }
    }

    if (errors.length) {
      addValidationMessage(box, errors);
      return false;
    }

    return true;
  }

  /*
   * Run validation before the existing announcement form saves.
   */
  document.addEventListener(
    "click",
    function (event) {
      const button = event.target.closest(
        ".ann-box-v29 .ann-actions-v29 button"
      );

      if (!button) {
        return;
      }

      const text = (button.textContent || "").trim();

      if (/cancel|close/i.test(text)) {
        return;
      }

      if (!validateAnnouncementForm()) {
        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation();
      }
    },
    true
  );

  /*
   * Attempt to get the announcement ID from the selected row.
   * Different versions of the manager may use different data attributes,
   * so several possible attribute names are checked.
   */
  function selectedAnnouncementId() {
    const selected = document.querySelector(
      ".ann-row-v31.selected"
    );

    if (!selected) {
      return "";
    }

    return (
      selected.dataset.id ||
      selected.dataset.announcementId ||
      selected.getAttribute("data-announcement-id") ||
      ""
    );
  }

  async function resolveArchivedAnnouncementId() {
    let announcementId = selectedAnnouncementId();

    if (announcementId) {
      return announcementId;
    }

    /*
     * If the existing manager did not place the ID on the selected row,
     * locate it by matching the displayed title against archived records.
     */
    const title =
      document
        .querySelector(".ann-details-v31 h3")
        ?.textContent?.trim() || "";

    if (!title) {
      return "";
    }

    const response = await fetch(
      API + "/admin/announcements",
      {
        headers: {
          authorization: "Bearer " + getToken()
        }
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.message || "Unable to retrieve announcements."
      );
    }

    const matches = (data.announcements || []).filter(
      function (announcement) {
        return (
          announcement.status === "ARCHIVED" &&
          announcement.title === title
        );
      }
    );

    if (matches.length === 1) {
      return matches[0].announcementId;
    }

    return "";
  }

  async function deleteArchivedAnnouncement() {
    let announcementId;

    try {
      announcementId =
        await resolveArchivedAnnouncementId();
    } catch (error) {
      alert(error.message);
      return;
    }

    if (!announcementId) {
      alert(
        "Unable to identify the archived announcement. " +
        "Refresh the announcement manager and try again."
      );
      return;
    }

    const approved = window.confirm(
      "Permanently delete this archived announcement?\n\n" +
      "This action cannot be undone."
    );

    if (!approved) {
      return;
    }

    try {
      const response = await fetch(
        API +
          "/admin/announcements/" +
          encodeURIComponent(announcementId),
        {
          method: "DELETE",
          headers: {
            authorization: "Bearer " + getToken(),
            "content-type": "application/json"
          }
        }
      );

      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data.message ||
          "Unable to delete the archived announcement."
        );
      }

      alert("Archived announcement deleted.");

      /*
       * Close and reopen the manager so the list is reloaded
       * from the announcements API.
       */
      document
        .querySelector(".ann-manager-backdrop-v31")
        ?.remove();

      window.setTimeout(function () {
        document
          .querySelector(".ann-manager-button-v31")
          ?.click();
      }, 100);
    } catch (error) {
      alert(error.message);
    }
  }

  function isArchivedDetailsView(details) {
    const explicitStatus = Array.from(
      details.querySelectorAll(
        ".ann-status-v31, dd"
      )
    ).some(function (element) {
      return (
        (element.textContent || "")
          .trim()
          .toUpperCase() === "ARCHIVED"
      );
    });

    return explicitStatus;
  }

  function installArchivedDeleteButton() {
    const details = document.querySelector(
      ".ann-details-v31"
    );

    if (!details) {
      return;
    }

    const archived = isArchivedDetailsView(details);
    let button = details.querySelector(".ann-delete-v24");

    if (!archived) {
      if (button) {
        button.remove();
      }

      return;
    }

    if (button) {
      return;
    }

    button = document.createElement("button");
    button.type = "button";
    button.className = "ann-delete-v24";
    button.textContent =
      "Delete archived announcement";
    button.addEventListener(
      "click",
      deleteArchivedAnnouncement
    );

    const actions = details.querySelector(
      ".ann-detail-actions-v31"
    );

    if (actions) {
      actions.appendChild(button);
    } else {
      details.appendChild(button);
    }
  }

  /*
   * The announcement manager renders dynamically, so monitor the page
   * and install the archived-only delete button when appropriate.
   */
  const observer = new MutationObserver(function () {
    window.requestAnimationFrame(
      installArchivedDeleteButton
    );
  });

  observer.observe(document.documentElement, {
    childList: true,
    subtree: true
  });

  installArchivedDeleteButton();
})();
</script>

<script>
(function(){
  function applyV28(){
    if(!window.selected || !document.getElementById('detail')) return;

    const detail=document.getElementById('detail');

    let existing=document.getElementById('bl-v28-dates');
    if(existing) existing.remove();

    const s=window.selected;

    const hasConfirmed=s.confirmedDate||s.confirmedTime;
    const hasProposed=s.proposedDate||s.proposedTime;

    if(!hasConfirmed && !hasProposed) return;

    const block=document.createElement('div');
    block.id='bl-v28-dates';
    block.style.margin='12px 0';
    block.style.padding='12px';
    block.style.border='1px solid #ddd0c5';
    block.style.borderRadius='10px';
    block.style.background='#faf7f2';

    let html='';

    if(hasConfirmed){
      html += `
      <div style="color:#1f704d;margin-bottom:8px">
        <strong>Confirmed Appointment</strong><br>
        Date: ${s.confirmedDate || '—'}<br>
        Time: ${s.confirmedTime || '—'}
      </div>`;
    }

    if(hasProposed){
      html += `
      <div style="color:#8a4d00">
        <strong>Proposed Reschedule</strong><br>
        Date: ${s.proposedDate || '—'}<br>
        Time: ${s.proposedTime || '—'}
      </div>`;
    }

    block.innerHTML=html;

    const special=
      detail.querySelector('.special-request');

    if(special){
      special.before(block);
    }else{
      detail.prepend(block);
    }

    const notes=document.getElementById('notes');
    if(notes && !notes.value.trim()){
      notes.placeholder='No private notes saved.';
    }
  }

  const originalShow=window.show;

  window.show=function(id){
    originalShow(id);
    setTimeout(applyV28,50);
  };

  document.addEventListener('click',()=>{
    setTimeout(applyV28,150);
  },true);
})();
</script>
