<!-- BLOOMING_STATUS_PILLS_V13_STYLE -->
<style>
  /* Appointment status labels must size to their text, not to the card. */
  .card .badge,
  .card .status,
  .appointment .badge,
  .appointment .status,
  .appointment-state .badge,
  .appointment-state .status,
  [data-status-pill-v13] {
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    flex: 0 0 auto !important;
    width: auto !important;
    height: auto !important;
    min-width: 0 !important;
    min-height: 0 !important;
    max-width: 100% !important;
    aspect-ratio: auto !important;
    padding: 6px 11px !important;
    margin: 0 !important;
    border-radius: 999px !important;
    white-space: nowrap !important;
    line-height: 1.15 !important;
    font-size: 12px !important;
    font-weight: 800 !important;
    letter-spacing: 0.2px !important;
    text-align: center !important;
    overflow: visible !important;

  .card > .badge,
  .card > .status,

    justify-self: end !important;
  }

    background: #fff4cf !important;

  }

  }

  }

  }

<body><header><div><h1 style="margin:0">Blooming Lotus</h1><small>Front-Desk Dashboard</small></div><div><button id="refresh">Refresh</button> <button id="logout">Sign out</button></div></header><main><div id="login" class="notice"><h2>Front-desk sign in required</h2><button class="primary" id="signin">Sign in securely</button></div><div id="app" class="hidden"><div class="toolbar"><input id="search" placeholder="Search name, phone, email"><select id="filter"><option value="">All statuses</option><option>REQUESTED</option><option>CONTACTED</option><option>CONFIRMED</option><option>RESCHEDULE_NEEDED</option><option>CANCELLED</option><option>COMPLETED</option><option>NO_SHOW</option></select><button onclick="print()">Print</button></div><div class="grid"><section class="list" id="list"></section><aside class="detail" id="detail"><h2>Select an appointment</h2></aside></div></div></main>
<div id="action-modal" class="modalx"><div class="modalbox"><h2 id="modal-title">Update appointment</h2><div id="modal-fields"></div><label><input id="notify" type="checkbox"> Email customer about this update</label><label>Customer message</label><textarea id="customer-message" rows="4"></textarea><div class="modal-actions"><button id="modal-cancel">Cancel</button><button id="modal-save" class="primary">Save update</button></div></div></div><div id="flash" class="flash hidden"></div>
<script src="/admin/logo-dedupe-v28.js?v=28"></script>

<script>
const CFG={api:"https://zy28vr7v2h.execute-api.us-east-1.amazonaws.com",client:"1cf50fvbqs3j7v9qemfm7id3t2",cognito:"https://bloominglotus-frontdesk-460425809139.auth.us-east-1.amazoncognito.com",redirect:location.origin+'/admin/index.html',ses:false};
let token=sessionStorage.getItem('bl_access'),items=[],selected=null,pendingStatus=null;
const $=id=>document.getElementById(id), b64=x=>btoa(String.fromCharCode(...new Uint8Array(x))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const transitions={REQUESTED:['CONTACTED','CONFIRMED','RESCHEDULE_NEEDED','CANCELLED'],CONTACTED:['CONTACTED','CONFIRMED','RESCHEDULE_NEEDED','CANCELLED'],RESCHEDULE_NEEDED:['CONTACTED','CONFIRMED','RESCHEDULE_NEEDED','CANCELLED'],CONFIRMED:['CONFIRMED','RESCHEDULE_NEEDED','CANCELLED','COMPLETED','NO_SHOW'],CANCELLED:[],COMPLETED:[],NO_SHOW:[]};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function flash(m){$('flash').textContent=m;$('flash').classList.remove('hidden');setTimeout(()=>$('flash').classList.add('hidden'),4500)}
async function startSecureSignIn(){let v=b64(crypto.getRandomValues(new Uint8Array(32))),c=b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));sessionStorage.setItem('bl_verifier',v);location.href=CFG.cognito+'/oauth2/authorize?'+new URLSearchParams({client_id:CFG.client,response_type:'code',scope:'openid email',redirect_uri:CFG.redirect,code_challenge_method:'S256',code_challenge:c})}
async function callback(){let code=new URLSearchParams(location.search).get('code');if(!code)return;let body=new URLSearchParams({grant_type:'authorization_code',client_id:CFG.client,code,redirect_uri:CFG.redirect,code_verifier:sessionStorage.getItem('bl_verifier')});let r=await fetch(CFG.cognito+'/oauth2/token',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body}),d=await r.json();if(!r.ok)throw Error(d.error_description||'Login failed');token=d.access_token;sessionStorage.setItem('bl_access',token);history.replaceState({},'',CFG.redirect)}
async function call(path='',opt={}){let r=await fetch(CFG.api+'/admin/appointments'+path,{...opt,headers:{authorization:'Bearer '+token,'content-type':'application/json'}}),d=await r.json();if(!r.ok)throw Error(d.message||'Request failed');return d}
function render(){let q=$('search').value.toLowerCase(),f=$('filter').value;let view=items.filter(x=>(!f||x.status==f)&&JSON.stringify(x).toLowerCase().includes(q));$('list').innerHTML=view.map(x=>`<article class="card" data-id="${esc(x.appointmentId)}"><div><div class="name">${esc(x.customerName||x.name||'Customer')}</div><div>${esc(x.preferredDate||x.date||'')} ${esc(x.preferredTime||x.time||'')}</div><div class="muted">${esc(x.phone||'')} · ${esc(x.email||'')}</div>${x.notes?`<div class="muted"><b>Special request:</b> ${esc(x.notes)}</div>`:''}</div><span class="badge">${esc(x.status||'REQUESTED')}</span></article>`).join('')||'<div class="notice">No appointments found.</div>';document.querySelectorAll('.card').forEach(e=>e.onclick=()=>show(e.dataset.id))}
function show(id){selected=items.find(x=>x.appointmentId==id);let st=selected.status||'REQUESTED',allowed=transitions[st]||[];$('detail').innerHTML=`<h2>${esc(selected.customerName||selected.name||'Customer')}</h2><p><b>Request:</b> ${esc(id)}</p><p><b>Phone:</b> <a href="tel:${esc(selected.phone||'')}">${esc(selected.phone||'—')}</a></p><p><b>Email:</b> <a href="mailto:${esc(selected.email||'')}">${esc(selected.email||'—')}</a></p><p><b>Service:</b> ${esc(selected.service||'—')}</p><p><b>Therapist:</b> ${esc(selected.therapist||'No preference')}</p><p><b>Preferred date:</b> ${esc(selected.preferredDate||selected.date||'—')}</p><p><b>Preferred time:</b> ${esc(selected.preferredTime||selected.time||'—')}</p><p><b>Session length:</b> ${esc(selected.sessionLength||selected.length||'—')}</p><section class="special-request"><p class="special-request-label">Special request notes</p><p class="special-request-text">${esc(selected.notes||'No special request notes were provided.')}</p></section><label>Private front-desk notes</label><textarea id="notes">${esc(selected.frontDeskNotes||'')}</textarea><button id="save-notes" class="save-note">Save private notes</button><div class="actions">${['CONTACTED','CONFIRMED','RESCHEDULE_NEEDED','CANCELLED','COMPLETED','NO_SHOW'].map(x=>`<button class="status-btn ${x==st?'current':''}" data-status="${x}" ${x!=st&&!allowed.includes(x)?'disabled':''}>${x.replaceAll('_',' ')}</button>`).join('')}</div><h3>Activity history</h3>${(selected.activityHistory||[]).slice().reverse().map(h=>`<div class="muted">${esc(h.status)} · ${esc(h.at)} · ${esc(h.by)}</div>`).join('')||'<div class="muted">No status history yet.</div>'}`;$('save-notes').onclick=()=>saveNotes();document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>openAction(b.dataset.status))}
async function saveNotes(){let d=await call('/'+encodeURIComponent(selected.appointmentId),{method:'PATCH',body:JSON.stringify({status:selected.status||'REQUESTED',frontDeskNotes:$('notes').value})});Object.assign(selected,d.appointment);render();show(selected.appointmentId);flash('Private notes saved.')}
function openAction(status){pendingStatus=status;let html='';if(status=='CONTACTED')html='<label>Contact method</label><select id="contact-method"><option>Phone</option><option>Email</option><option>Voicemail</option><option>In person</option></select>';if(status=='CONFIRMED')html='<label>Confirmed date</label><input id="confirmed-date" type="date"><label>Confirmed time</label><input id="confirmed-time" type="time">';if(status=='RESCHEDULE_NEEDED')html='<label>Proposed date</label><input id="proposed-date" type="date"><label>Proposed time</label><input id="proposed-time" type="time">';if(['CANCELLED','COMPLETED','NO_SHOW'].includes(status))html='<label>Reason / completion note</label><textarea id="reason" rows="3"></textarea>';$('modal-title').textContent=status.replaceAll('_',' ');$('modal-fields').innerHTML=html;$('notify').checked=CFG.ses&&['CONFIRMED','RESCHEDULE_NEEDED','CANCELLED'].includes(status);$('notify').disabled=!CFG.ses;$('customer-message').value=defaultMessage(status);$('action-modal').classList.add('open')}
function defaultMessage(s){if(s=='CONFIRMED')return 'Your Blooming Lotus appointment has been confirmed.';if(s=='RESCHEDULE_NEEDED')return 'Please contact Blooming Lotus regarding a proposed appointment time.';if(s=='CANCELLED')return 'Your Blooming Lotus appointment request has been cancelled.';return ''}
async function saveAction(){let payload={status:pendingStatus,frontDeskNotes:$('notes').value,notifyCustomer:$('notify').checked,customerMessage:$('customer-message').value};for(let [id,key] of [['contact-method','contactMethod'],['confirmed-date','confirmedDate'],['confirmed-time','confirmedTime'],['proposed-date','proposedDate'],['proposed-time','proposedTime'],['reason','reason']])if($(id))payload[key]=$(id).value;try{let d=await call('/'+encodeURIComponent(selected.appointmentId),{method:'PATCH',body:JSON.stringify(payload)});Object.assign(selected,d.appointment);render();show(selected.appointmentId);$('action-modal').classList.remove('open');flash('Status updated.'+(d.notification?.sent?' Customer email sent.':payload.notifyCustomer?' Customer email was not sent.':''))}catch(e){alert(e.message)}}
async function load(){let d=await call();items=d.appointments||[];render();if(selected){let same=items.find(x=>x.appointmentId==selected.appointmentId);if(same)show(same.appointmentId)}}
$('signin').addEventListener('click',startSecureSignIn);$('logout').onclick=()=>{sessionStorage.clear();location.href=CFG.cognito+'/logout?'+new URLSearchParams({client_id:CFG.client,logout_uri:location.origin+'/'})};$('refresh').onclick=load;$('search').oninput=render;$('filter').onchange=render;$('modal-cancel').onclick=()=>$('action-modal').classList.remove('open');$('modal-save').onclick=saveAction;(async()=>{try{await callback();if(token){$('login').classList.add('hidden');$('app').classList.remove('hidden');await load()}}catch(e){alert(e.message)}})();
</script><script defer src="/admin/phone-appointments.js?v=6"></script>  <script defer src="/admin/auth-visibility.js?v=8"></script>
<script defer src="/admin/status-icon-fix.js?v=12"></script>
<script defer src="/admin/status-pills.js?v=13"></script>
<script defer src="/admin/detail-actions.js?v=14"></script>
<script defer src="/announcements-v29.js?v=29"></script>
<script defer src="/admin/admin-announcements-v29.js?v=29"></script>
<script defer src="/slim-announcements-v30.js?v=30"></script>
<script defer src="/admin/announcement-manager-v31.js?v=31"></script>
</body></html>
